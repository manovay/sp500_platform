

services:
  # PostgreSQL database service
  postgres:
    image: postgres:13
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: manovay          # Database username
      POSTGRES_PASSWORD: Padhai007   # Database password
      POSTGRES_DB: sp500_db            # Database name
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent storage for database data
    ports:
      - "1111:5432"                   # Expose PostgreSQL port
    networks:
      - sp500_net                      # Connect to the custom network

  sp500-backend: # NEW SERVICE BLOCK
    container_name: sp500-backend # NEW SERVICE BLOCK
    build: ./backend # NEW SERVICE BLOCK
    depends_on: # NEW SERVICE BLOCK
      - postgres # NEW SERVICE BLOCK
    environment: # NEW SERVICE BLOCK
      DB_HOST: postgres # NEW SERVICE BLOCK
      DB_PORT: 5432 # NEW SERVICE BLOCK
      DB_USER: ${DB_USER:-manovay} # NEW SERVICE BLOCK (match postgres credentials)
      DB_PASSWORD: ${DB_PASSWORD:-Padhai007} # NEW SERVICE BLOCK
      DB_NAME: ${DB_NAME:-sp500_db} # NEW SERVICE BLOCK
      ADMIN_TOKEN: ${ADMIN_TOKEN} # NEW SERVICE BLOCK
    ports: # NEW SERVICE BLOCK
      - "5000:5000" # NEW SERVICE BLOCK
    networks: # NEW SERVICE BLOCK
      - sp500_net # NEW SERVICE BLOCK

  # pgAdmin service for managing PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com   # Default pgAdmin login email
      PGADMIN_DEFAULT_PASSWORD: admin           # Default pgAdmin login password
    ports:
      - "8080:80"                    # Expose pgAdmin web interface on port 8080
    links:
      - postgres                      # Link pgAdmin to the postgres service
    networks:
      - sp500_net                    # Connect to the custom network

# Named volume for PostgreSQL data persistence
volumes:
  postgres_data:
    # Docker manages the volume for persistent database storage

# Custom network for inter-service communication
networks:
  sp500_net:
    driver: bridge 
